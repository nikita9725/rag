[project]
name = "rag-service"
version = "0.1.0"
description = "Учебный RAG-сервис с локальной базой знаний"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "huggingface-hub>=0.36,<2",
    "pydantic>=2.12",
    "openai>=2,<3",
    "pydantic-settings>=2,<3",
    "sentence-transformers>=5.1,<6",
    "weaviate-client>=4.17,<5",
]

[project.scripts]
rag-kb = "rag_service.cli:main"
rag-query = "rag_service.query_cli:main"
rag-answer = "rag_service.answer_cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-m 'not integration and not e2e'"
testpaths = ["tests"]
markers = [
    "integration: uses the saved local embedding model and a real Weaviate instance",
    "e2e: runs the complete pipeline with the saved model and a real Weaviate instance",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
files = ["src", "tests"]
strict = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PLC0415"]
